<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thutapi — the waiting race</title>
<style>
  :root{
    --cream:#fdf3e7; --ink:#3b2a21; --warm:#e0b48c; --track:#f6e6d3;
    --line:#d8c3ab; --done:#c9885a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
       font:16px/1.4 "Fredoka",system-ui,sans-serif;padding:20px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#7a6355;font-size:15px}

  .race{position:relative;background:var(--track);border-radius:20px;
        padding:14px 0 10px;overflow:hidden}
  /* 8 page markers = the only progress indicator. No percentage. */
  .markers{position:absolute;inset:0;display:grid;
           grid-template-columns:repeat(8,1fr);pointer-events:none}
  .markers i{border-right:2px dashed var(--line)}
  .markers i:last-child{border-right:0}
  .markers i.lit{background:rgba(201,136,90,.13)}

  .lane{position:relative;height:52px}
  .runner{position:absolute;top:6px;left:0;width:64px;height:44px;
          transition:transform 1.4s cubic-bezier(.34,1.2,.64,1)}
  .bob{animation:bob .34s ease-in-out infinite alternate;transform-origin:50% 90%}
  @keyframes bob{from{transform:translateY(0) rotate(-1.2deg)}
                 to{transform:translateY(-4px) rotate(1.2deg)}}
  .leg{transform-origin:50% 12%;animation:stride .34s linear infinite}
  .leg.b{animation-delay:-.17s}
  @keyframes stride{0%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}
                    100%{transform:rotate(26deg)}}
  .tail{transform-origin:0% 50%;animation:wag .5s ease-in-out infinite alternate}
  @keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}

  .caption{margin-top:14px;font-size:15px;color:#7a6355;text-align:center}
  button{margin-top:16px;font:inherit;padding:12px 20px;border:0;border-radius:14px;
         background:var(--done);color:#fff;min-height:48px;touch-action:manipulation}

  @media (prefers-reduced-motion:reduce){
    .bob,.leg,.tail{animation:none}
    .runner{transition:none}
  }
</style>
<h1>Your book is being drawn…</h1>
<p class="sub">Eight pages. The animals move up one marker each time a page is finished.</p>

<div class="race" id="race">
  <div class="markers" id="markers"></div>
</div>
<div class="caption" id="cap">no pages yet</div>
<button onclick="pageDone()">▶ pretend a page finished</button>

<script>
const ANIMALS = [
  {n:'rabbit',   body:'#c9885a', ear:'tall'},
  {n:'tortoise', body:'#7f9a6b', ear:'none'},
  {n:'fox',      body:'#d2703a', ear:'point'},
  {n:'duck',     body:'#e8b93f', ear:'none'},
  {n:'cat',      body:'#8a7d8f', ear:'point'},
];
// One SVG per animal. Everything is ellipses and rounded rects: the "running"
// is two leg pairs rotating out of phase plus a body bob. No sprite sheet.
function svg(a){
  const ear = a.ear==='tall'
    ? `<ellipse cx="46" cy="8" rx="3.5" ry="9" fill="${a.body}"/>
       <ellipse cx="53" cy="9" rx="3.5" ry="8" fill="${a.body}"/>`
    : a.ear==='point'
    ? `<path d="M43 12 L46 2 L51 11 Z" fill="${a.body}"/>
       <path d="M52 11 L57 2 L59 12 Z" fill="${a.body}"/>` : '';
  return `<svg viewBox="0 0 64 44" width="64" height="44" aria-hidden="true">
    <g class="bob">
      <rect class="leg"   x="18" y="26" width="6" height="15" rx="3" fill="${a.body}"/>
      <rect class="leg b" x="34" y="26" width="6" height="15" rx="3" fill="${a.body}"/>
      <path class="tail" d="M12 22 q-9 -4 -11 4" stroke="${a.body}" stroke-width="4"
            stroke-linecap="round" fill="none"/>
      <ellipse cx="27" cy="24" rx="18" ry="11" fill="${a.body}"/>
      ${ear}
      <circle cx="49" cy="19" r="9" fill="${a.body}"/>
      <circle cx="53" cy="17" r="1.7" fill="#2b1d16"/>
      <circle cx="57.5" cy="20" r="1.6" fill="#2b1d16" opacity=".75"/>
    </g></svg>`;
}
const PAGES = 8;
const race = document.getElementById('race');
const markers = document.getElementById('markers');
for (let i=0;i<PAGES;i++) markers.appendChild(document.createElement('i'));

const runners = ANIMALS.map(a=>{
  const lane = document.createElement('div'); lane.className='lane';
  const r = document.createElement('div'); r.className='runner';
  r.innerHTML = svg(a); lane.appendChild(r); race.appendChild(lane);
  // per-animal stride jitter, so nobody runs in lockstep
  lane.querySelectorAll('.leg,.bob,.tail').forEach(el=>{
    el.style.animationDuration = (0.28 + Math.random()*0.22).toFixed(2)+'s';
  });
  return r;
});

let done = 0;
function place(){
  const w = race.clientWidth - 72;
  runners.forEach(r=>{
    // pack advances with real progress; the jostle is cosmetic
    const jitter = (Math.random()-0.5) * (w/PAGES) * 0.75;
    const x = Math.max(0, Math.min(w, (done/PAGES)*w + jitter));
    r.style.transform = `translateX(${x}px)`;
  });
  [...markers.children].forEach((m,i)=>m.classList.toggle('lit', i<done));
  document.getElementById('cap').textContent =
    done===0 ? 'no pages yet' :
    done>=PAGES ? 'all eight pages — your book is ready' :
    `${done} of ${PAGES} pages drawn`;
}
function pageDone(){ if(done<PAGES) done++; place(); }
addEventListener('resize', place);
place();
setInterval(()=>{ if(done>0 && done<PAGES) place(); }, 2200); // idle jostle
</script>
