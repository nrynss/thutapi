<!doctype html>

<title>Thutapi — the waiting race (T9a prototype)</title>
<!--
  T9a, screen 5 of PLAN.md §The flow.

  THE INTERFACE IS ONE NUMBER: --done, on .race. Nothing else.
  Everything below is static markup plus CSS. There is no DOM
  construction anywhere, which is what makes this independent of T9:
  it needs no Preact (not vendored yet, and static/vendor/ is T9's),
  and it does not hand-roll DOM, which AGENTS.md:149 forbids.

  Server-rendered it already works with JS switched off, per
  AGENTS.md's "a cold link works without JS". When T9 exists, the
  Preact component is one line: style=${`--done:${n}`}.

  The <script> at the bottom is DEMO SCAFFOLDING for the button.
  It ships nowhere.
-->
<style>
  :root{
    /* T9 owns the real palette; these are placeholders and every one
       of them is a var, so T9's tokens drop straight in. */
    --cream:#fdf3e7; --ink:#3b2a21; --track:#f6e6d3;
    --line:#d8c3ab; --lit:#c9885a;
    --pages:8;              /* §Decisions row 8: one constant, here */
    --runner-w:64px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);padding:20px;
       font:16px/1.4 "Fredoka",system-ui,sans-serif}
  h1{font-size:22px;margin:0 0 4px} p{margin:0 0 18px;color:#7a6355;font-size:15px}

  .race{--done:0;                     /* ← the entire interface */
        position:relative;container-type:inline-size;
        background:var(--track);border-radius:20px;padding:14px 0 10px;
        overflow:hidden}

  /* Markers: eight cells, the first --done of them lit. Pure CSS from
     the same number — no per-element class toggling. */
  .markers{position:absolute;inset:0;display:grid;
           grid-template-columns:repeat(var(--pages),1fr)}
  .markers i{border-right:2px dashed var(--line)}
  .markers i:last-child{border-right:0}
  .markers::before{content:"";position:absolute;inset:0;
    width:calc(var(--done) / var(--pages) * 100%);
    background:rgba(201,136,90,.16);transition:width 1.2s ease}

  .lane{position:relative;height:52px}
  /* transform only — never a layout property, on a screen that holds
     for six minutes on a phone. cqw resolves against .race. */
  .runner{position:absolute;top:6px;left:0;width:var(--runner-w);height:44px;
    transform:translateX(calc(
      var(--done) / var(--pages) * (100cqw - var(--runner-w)) + var(--jit,0px)));
    transition:transform 1.4s cubic-bezier(.34,1.2,.64,1)}
  /* static per-lane offset + a slow wobble: the jostle, no JS */
  .lane:nth-child(2) .runner{--jit:6px;  --stride:.30s}
  .lane:nth-child(3) .runner{--jit:-16px;--stride:.38s}
  .lane:nth-child(4) .runner{--jit:14px; --stride:.28s}
  .lane:nth-child(5) .runner{--jit:-8px; --stride:.44s}
  .lane:nth-child(6) .runner{--jit:2px;  --stride:.34s}

  .bob{animation:bob var(--stride,.34s) ease-in-out infinite alternate;
       transform-origin:50% 90%}
  @keyframes bob{from{transform:translateY(0) rotate(-1.2deg)}
                 to{transform:translateY(-4px) rotate(1.2deg)}}
  .leg{transform-origin:50% 12%;animation:stride var(--stride,.34s) linear infinite}
  .leg.b{animation-delay:calc(var(--stride,.34s) / -2)}
  @keyframes stride{0%{transform:rotate(26deg)}50%{transform:rotate(-26deg)}
                    100%{transform:rotate(26deg)}}
  .tail{transform-origin:0% 50%;animation:wag .5s ease-in-out infinite alternate}
  @keyframes wag{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}

  /* The progress information must survive the motion being switched off. */
  @media (prefers-reduced-motion:reduce){
    .bob,.leg,.tail{animation:none}
    .runner,.markers::before{transition:none}
  }
  button{margin-top:16px;font:inherit;padding:12px 20px;border:0;border-radius:14px;
         background:var(--lit);color:#fff;min-height:48px;touch-action:manipulation}
</style>

<h1>Your book is being drawn…</h1>
<p>Eight pages. The animals move up one marker each time a page is finished.</p>

    <path class="tail" d="M12 22 q-10 -10 -2 -14" stroke="#8a7d8f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="27" cy="24" rx="18" ry="10" fill="#8a7d8f"/>
    <path d="M43 12 L45 3 L50 11 Z" fill="#8a7d8f"/><path d="M51 11 L56 3 L58 12 Z" fill="#8a7d8f"/>

<button onclick="const r=race.style,n=+(getComputedStyle(race).getPropertyValue('--done'))||0;r.setProperty('--done',Math.min(8,n+1))">
  ▶ pretend a page finished
</button>
