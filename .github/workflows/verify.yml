# Verification only. Never builds or publishes an image.
#
# Skips doc-only changes: the dev-diary and the markdown around it change
# far more often than the code, and a green tick on a prose edit tells you
# nothing while still costing a queue slot and burying real signal.
name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'dev-diary/**'
      - '.env.example'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'dev-diary/**'
      - '.env.example'
      - '.gitignore'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      # One test run, reused by the coverage gate below -- -race and -cover
      # together, teed so the gate parses the same output the log shows.
      - name: go test -race
        run: set -o pipefail; go test ./... -race -cover | tee test.out

      # Coverage floor. A package below this is almost always one whose error
      # branches or default-value paths are untested -- see AGENTS.md
      # "Testing -- what 'enough' means". The floor catches an untested
      # PACKAGE; it does not catch an untested DECISION (T2 shipped the wrong
      # model constant at 85.1%, because no test exercised the default path).
      # The per-track rules in AGENTS.md are what catch those.
      #
      # Two-tier per AGENTS.md item 7 and t2-round3.md M4: the remediated
      # internal/gmi packages are held to 85% (both clear it honestly:
      # media 95.1%, text 90.2% at the round-3 remediation); every other
      # package stays at 75% -- cmd/thutapi is outside T2's seam and rises
      # only when the track that owns it raises it.
      - name: coverage floor
        env:
          MIN: '75.0'
          GMI_MIN: '85.0'
        run: |
          awk -v min="$MIN" -v gmiMin="$GMI_MIN" '
            /\[no test files\]/ { print "warn " $2 ": no test files"; next }
            /coverage:/ {
              pct = ""
              for (i = 1; i <= NF; i++) if ($i == "coverage:") { pct = $(i+1); break }
              if (pct == "") next
              sub("%", "", pct)
              floor = min
              if ($2 ~ /^thutapi\/internal\/gmi\//) floor = gmiMin
              if (pct + 0 < floor + 0) { printf "FAIL %s: %s%% < %s%%\n", $2, pct, floor; bad = 1 }
              else printf "ok   %s: %s%%\n", $2, pct
            }
            END {
              if (bad) { print "Coverage floor is " min "% per package (" gmiMin "% for internal/gmi) per AGENTS.md."; exit 1 }
            }
          ' test.out

      # gofmt over the WHOLE tree, not just cmd/. Every remaining track
      # (T3-T13) writes under internal/, which the old `gofmt -l cmd/` never
      # inspected -- see adversarial-review/t2-round3.md M4. gofmt is the
      # mechanism AGENTS.md relies on to remove style drift between three
      # different agents; scoping it to one directory switched it off for the
      # tree that actually matters.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: shell syntax
        run: bash -n deploy/docker-run.sh
