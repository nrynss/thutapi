# Finish a book whose art landed but whose sound did not. MANUAL ONLY.
#
# A generation run keeps a book whose narration or music failed: it degrades
# to captioned-silent rather than binning eight paid-for illustrations. That
# is the right call during a run, and it leaves a child holding a silent film
# of their own story. This runs the repair on the box.
#
# It re-runs ONLY narration, the PDF and the film, from the pages already in
# the store, so it cannot hand the child a different book than the one they
# have. See internal/bookgen/complete.go and deploy/README.md.
#
#   gh workflow run complete-books.yml                     # every silent book
#   gh workflow run complete-books.yml -f book=<book-id>   # one book
#   gh workflow run complete-books.yml -f music=false      # speech only
name: complete-books

on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Book id to complete, or "all" for every book missing sound'
        required: false
        default: all
        type: string
      music:
        description: 'Mix a background music bed under the film'
        required: false
        default: true
        type: boolean
      prune_abandoned:
        description: 'Also delete the empty book rows abandoned interviews left behind (no pages, no media)'
        required: false
        default: false
        type: boolean

# Shares the deploy group: a repair rewrites the same book rows a deploy's
# container serves, and the two must never interleave.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Complete books on the production box
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BOOK: ${{ inputs.book }}
          MUSIC: ${{ inputs.music }}
          PRUNE: ${{ inputs.prune_abandoned }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          DEPLOY_TARGET="${DEPLOY_HOST}"
          if [[ "${DEPLOY_TARGET}" != *"@"* ]]; then
            DEPLOY_TARGET="root@${DEPLOY_TARGET}"
          fi

          # The book id reaches a shell on the box, so it is checked here
          # against the same shape the store mints: hex, or the literal
          # "all". Nothing else is passed on.
          if [[ ! "${BOOK}" =~ ^([0-9a-f]{8,64}|all)$ ]]; then
            echo "refusing to run: book id ${BOOK} is not a book id or 'all'" >&2
            exit 1
          fi

          FLAGS=""
          if [[ "${MUSIC}" != "true" ]]; then
            FLAGS="-complete-no-music"
          fi

          SSH_OPTS=(-i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=10)

          if [[ "${PRUNE}" == "true" ]]; then
            echo "Removing abandoned book rows..."
            ssh "${SSH_OPTS[@]}" "${DEPLOY_TARGET}" \
              "docker exec thutapi /thutapi -data-dir /data -prune-abandoned" \
              2>&1 | tee /tmp/prune_out.log
          fi

          echo "Completing '${BOOK}' (music=${MUSIC})..."
          # The repair is DETACHED on the box and polled, rather than held
          # open over ssh. A patient retry makes the command silent for
          # minutes at a time, and a silent connection is one the network
          # drops: the first run of this died on "client_loop: send
          # disconnect: Broken pipe" four minutes in, with the repair
          # abandoned halfway. setsid+nohup outlives the connection, and
          # `timeout` bounds the work whatever happens to this job — a
          # detached process nobody can see must never be able to run
          # forever.
          LOG=/srv/thutapi/complete.log
          ssh "${SSH_OPTS[@]}" "${DEPLOY_TARGET}" "
            rm -f ${LOG}
            setsid nohup timeout 3600 \
              docker exec thutapi /thutapi -data-dir /data -complete '${BOOK}' ${FLAGS} \
              > ${LOG} 2>&1 < /dev/null &
            echo detached
          "

          echo "Waiting for the repair to finish (polling ${LOG})..."
          while ssh "${SSH_OPTS[@]}" "${DEPLOY_TARGET}" \
              "pgrep -f 'thutapi -data-dir /data -complete' > /dev/null"; do
            sleep 30
          done

          ssh "${SSH_OPTS[@]}" "${DEPLOY_TARGET}" "cat ${LOG}" 2>&1 | tee /tmp/complete_out.log

          # The detached process's own exit status is not this shell's, so
          # the run is judged on what it wrote: any book it could not
          # complete fails the job, exactly as the attached form did.
          if grep -q '"msg":"could not complete book"' /tmp/complete_out.log; then
            echo "at least one book could not be completed" >&2
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Book completion" >> $GITHUB_STEP_SUMMARY
          echo "- **Book:** \`${{ inputs.book }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Music:** \`${{ inputs.music }}\`" >> $GITHUB_STEP_SUMMARY
          if [[ -f /tmp/prune_out.log ]]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 10 /tmp/prune_out.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [[ -f /tmp/complete_out.log ]]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 40 /tmp/complete_out.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "- No output: the job failed before it reached the box." >> $GITHUB_STEP_SUMMARY
          fi
