# Build the Thutapi image and publish it to GitHub Container Registry.
#
# Why this exists: the first deployment to the Hetzner box was an image
# built on a workstation and shipped with `docker save | ssh docker load`.
# That works, but nothing about it is reproducible — the box could not
# rebuild its own image, and the artifact existed in exactly two places.
#
# The published image is public, so the box pulls it anonymously and needs
# no registry credentials.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Verify before publishing. An image that fails vet or tests should
      # never reach a tag the box might pull.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test ./... -race

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd/)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: the commit SHA is the one to deploy — it names exactly one
      # build. `latest` is a convenience for humans, never for the box.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
