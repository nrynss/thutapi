<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thutapi — the waiting race (T9a)</title>
<!--
  T9a, screen 5 of PLAN.md §The flow.

  THE INTERFACE IS ONE NUMBER: --done, on .race. Nothing else.
  Everything below is static markup plus CSS. There is no DOM
  construction anywhere, which is what makes this independent of T9:
  it needs no Preact (not vendored yet, and static/vendor/ is T9's),
  and it does not hand-roll DOM, which AGENTS.md:149 forbids.

  Server-rendered it already works with JS switched off, per
  AGENTS.md's "a cold link works without JS". When T9 exists, the
  Preact component is one line: style=${`--done:${n}`}.

  THE 5 SPRITES (T9a deliverable):
  1. Hare / Rabbit: tall prominent upright ears, springy back, fluffy white puff tail, hind haunch.
  2. Tortoise: high domed carapace with multi-panel scutes & rim, extended wrinkled neck, stubby legs.
  3. Fox: sharp erect ears with dark tips, sleek tapered snout, large bushy tail with white brush, dark stockings.
  4. Duck: bird silhouette, prominent flat duck bill, fluttering wing, upturned tail feathers, webbed paddle feet.
  5. Little Mouse: giant circular saucer ears, pointy snout with whiskers, teardrop body, long S-curving whip tail.

  All sprites fit in the warm palette using CSS var() tokens with warm hex values.
  Animate transform only. No layout properties. Full prefers-reduced-motion support.

  The <script> at the bottom is DEMO SCAFFOLDING for the test buttons.
  It ships nowhere.
-->
<style>
  :root{
    /* T9 owns the real palette; these tokens drop straight into T9's theme. */
    --cream:#fdf3e7;
    --ink:#3b2a21;
    --track:#f6e6d3;
    --line:#d8c3ab;
    --lit:#c9885a;
    --pages:8;              /* §Decisions row 8: one constant, here */
    --runner-w:64px;
    --track-pad:8px;

    /* Animal palette tokens (warm palette) */
    --hare:#c9885a;
    --hare-dark:#b87547;
    --hare-ear-inner:#d88c7d;
    --hare-ear-pink:#e8a598;
    --hare-tail:#fff9f0;
    --hare-tail-shade:#faedd9;
    --hare-belly:#faedd9;

    --tortoise:#5f7a4d;
    --tortoise-dark:#6c8c56;
    --tortoise-light:#7a9c64;
    --tortoise-scute:#789a63;
    --tortoise-scute-shade:#6f915b;
    --tortoise-rim:#425735;
    --tortoise-rim-light:#8da860;
    --tortoise-mouth:#3a4e28;

    --fox:#d25a2a;
    --fox-dark:#2b1d16;
    --fox-ear-inner:#faedd9;
    --fox-tail-tip:#fff9f2;
    --fox-bib:#fff9f2;
    --fox-muzzle:#fff9f2;
    --fox-nose:#1a100c;

    --duck:#f4be42;
    --duck-feather-shade:#e0a028;
    --duck-belly-shade:#e0a028;
    --duck-wing:#e0a028;
    --duck-wing-covert:#faedd9;
    --duck-foot-back:#c45014;
    --duck-cheek:#f8a37e;
    --duck-bill:#d85f1e;
    --duck-bill-shade:#b84c12;
    --duck-nostril:#8a3408;

    --mouse:#8d7768;
    --mouse-dark:#7a6557;
    --mouse-ear:#e8a598;
    --mouse-ear-back:#c47d72;
    --mouse-tail:#d4887b;
    --mouse-belly:#f5eae1;
    --mouse-whisker:#4a3b32;

    --eye-dark:#2b1d16;
    --eye-sparkle:#ffffff;
    --nose-pink:#d9777f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);padding:20px;
       font:16px/1.4 "Fredoka",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  h1{font-size:22px;margin:0 0 4px}
  p{margin:0 0 18px;color:#7a6355;font-size:15px}

  .race{--done:0;                     /* ← the entire interface */
        position:relative;container-type:inline-size;
        background:var(--track);border-radius:20px;padding:14px 0 10px;
        overflow:hidden}

  /* Markers: eight cells, the first --done of them lit. Pure CSS from
     the same number — no per-element class toggling. */
  .markers{position:absolute;inset:0;display:grid;
           grid-template-columns:repeat(var(--pages),1fr);
           pointer-events:none}
  .markers i{border-right:2px dashed var(--line)}
  .markers i:last-child{border-right:0}
  .markers::before{content:"";position:absolute;inset:0;
    transform-origin:left;
    transform:scaleX(calc(var(--done) / var(--pages)));
    background:rgba(201,136,90,.16);transition:transform 1.2s ease}

  .lane{position:relative;height:52px}
  /* transform only — never a layout property, on a screen that holds
     for six minutes on a phone. cqw resolves against .race. */
  .runner{position:absolute;top:4px;left:0;width:var(--runner-w);height:44px;
    transform:translateX(calc(
      var(--track-pad,8px) +
      (var(--done) / var(--pages)) * (100cqw - var(--runner-w) - (2 * var(--track-pad,8px))) +
      var(--jit,0px)));
    transition:transform 1.4s cubic-bezier(.25,1,.5,1)}
  .runner svg{overflow:visible}

  /* Static per-lane offset + a distinct stride duration: the jostle, no JS */
  .lane:nth-child(2) .runner{--jit:4px;  --stride:.28s} /* Hare */
  .lane:nth-child(3) .runner{--jit:-6px; --stride:.48s} /* Tortoise */
  .lane:nth-child(4) .runner{--jit:6px;  --stride:.30s} /* Fox */
  .lane:nth-child(5) .runner{--jit:-4px; --stride:.36s} /* Duck */
  .lane:nth-child(6) .runner{--jit:2px;  --stride:.24s} /* Mouse */

  /* Pure transform animations on SVG limbs & bodies */
  .bob{animation:bob var(--stride,.34s) ease-in-out infinite alternate;
       transform-origin:50% 90%;transform-box:fill-box}
  @keyframes bob{from{transform:translateY(0) rotate(-1.2deg)}
                 to{transform:translateY(-4px) rotate(1.2deg)}}

  .leg{transform-origin:50% 12%;transform-box:fill-box;
       animation:stride var(--stride,.34s) linear infinite}
  .leg.b{animation-delay:calc(var(--stride,.34s) / -2)}
  @keyframes stride{0%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}
                    100%{transform:rotate(24deg)}}

  .tail{transform-origin:90% 60%;transform-box:fill-box;
        animation:wag .45s ease-in-out infinite alternate}
  @keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}

  .wing{transform-origin:25% 40%;transform-box:fill-box;
        animation:flap var(--stride,.34s) ease-in-out infinite alternate}
  @keyframes flap{0%{transform:rotate(-16deg)}100%{transform:rotate(22deg)}}

  /* The progress information must survive the motion being switched off. */
  @media (prefers-reduced-motion:reduce){
    .bob,.leg,.tail,.wing{animation:none !important}
    .runner,.markers::before{transition:none !important}
  }

  /* Demo scaffolding controls */
  .demo-controls{margin-top:16px;display:flex;gap:10px;align-items:center}
  button{font:inherit;padding:12px 20px;border:0;border-radius:14px;
         background:var(--lit);color:#fff;min-height:48px;touch-action:manipulation;
         cursor:pointer;font-weight:600}
  button.reset{background:var(--ink);opacity:.85}
  button:active{transform:scale(.98)}
</style>
