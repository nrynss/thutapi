{{define "shelf"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thutapi</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="shelf"><main id="app" data-interview-id="shelf" data-books="{{.BooksJSON}}"><p class="eyebrow">Thutapi picture books</p><h1>Stories made from your ideas.</h1><p>Pick a cozy book from the shelf, or make one with a grown-up.</p><a class="primary" data-start href="/interview/new">Make your own book</a>{{if .Books}}<section class="shelf-books"><h2>From the shelf</h2><div class="book-list">{{range .Books}}<a class="book-card" href="/book/{{.ID}}"><span class="book-title">{{.Title}}</span>{{if .Byline}}<span class="book-byline warm">By {{.Byline}}</span>{{end}}</a>{{end}}</div></section>{{end}}<noscript><p>Turn on JavaScript to make a new book. Shared books still open here.</p></noscript></main><script type="application/json" id="shelf-books">{{.BooksJSON}}</script><script type="module" src="/static/app.js?v=2"></script></body></html>{{end}}
